name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            docs/requirements.txt
      - name: Install development dependencies
        run: |
          if [[ -f docs/requirements.txt ]]; then
            python -m pip install -e ".[dev,comparison]" -r docs/requirements.txt
          else
            python -m pip install -e ".[dev,comparison,docs,viz]"
          fi
      - name: Code health
        run: |
          python -m compileall -q whydra tests .github
          if [[ -d whydra_benchmarks ]]; then
            python -m compileall -q whydra_benchmarks main.py
          fi
          python -m pre_commit run --all-files
      - name: Tests
        run: python -m pytest -q

      - name: Documentation
        run: python -m sphinx -W --keep-going -b html docs/source docs/_build/html
      - name: Build and install wheel
        shell: bash
        run: |
          python -m build --wheel
          python -m venv "$RUNNER_TEMP/whydra-wheel"
          "$RUNNER_TEMP/whydra-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/whydra-wheel/bin/python" -I -c "import whydra; from whydra.algorithms import StandalonePCStable, StandaloneRAIStable; assert whydra.available_standalone_algorithms(); whydra.create_standalone_algorithm('pc_stable', n_jobs=1)"

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository and code checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject tracked playground files
        shell: bash
        run: |
          if git ls-files --error-unmatch -- ':(top,icase)playground' >/dev/null 2>&1; then
            echo "::error::The root playground directory is reserved for local work."
            git ls-files -- ':(top,icase)playground'
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Check formatting of all tracked C++ and CUDA files
        run: python -m pre_commit run clang-format-check --hook-stage pre-push --all-files
      - name: Check new commit messages
        if: github.event_name != 'workflow_dispatch' && github.event.deleted != true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python .github/scripts/check_commit_messages.py "$BASE_SHA" "$HEAD_SHA"
      - name: Run remaining pre-commit checks
        env:
          SKIP: ruff-check,ruff-format,basedpyright,clang-format,clang-tidy
        run: python -m pre_commit run --all-files --show-diff-on-failure
      - name: Verify the private promotion includes the calculated version
        if: >-
          github.event.repository.private && github.event_name == 'pull_request' && github.base_ref == 'main' &&
          (github.head_ref == 'dev' || startsWith(github.head_ref, 'release/')) &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git checkout --detach "$HEAD_SHA"
          python .github/scripts/release_version.py --apply | tee -a "$GITHUB_STEP_SUMMARY"
          if ! git diff --exit-code -- whydra/VERSION; then
            echo "::error::Merge the version PR into dev and update the promotion branch."
            exit 1
          fi

  python-analysis:
    name: ${{ matrix.tool }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tool: [Ruff, basedpyright]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Install optional libraries for type analysis
        if: matrix.tool == 'basedpyright'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[comparison,viz,torch]"
      - name: Check lint and formatting
        if: matrix.tool == 'Ruff'
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Check types
        if: matrix.tool == 'basedpyright'
        run: python -m basedpyright --warnings

  tests:
    name: Tests on ${{ matrix.os }} with Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-2022
            python: '3.12'
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,viz,comparison]"
      - run: python -m pip check
      - run: python -m pytest
      - name: Test private release and sync helpers
        if: github.event.repository.private && runner.os == 'Linux' && matrix.python == '3.12'
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'

  docs:
    name: Build HTML documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[docs]"
      - run: python -m sphinx -W --keep-going -b html docs/source docs/_build/html
      - name: Upload documentation for GitHub Pages
        if: &publish_docs >-
          github.repository == 'sb-ai-lab/Whydra' && !github.event.repository.private &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  package:
    uses: ./.github/workflows/distributions.yml

  ci:
    name: CI
    needs: [quality, python-analysis, tests, docs, package]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

  pages:
    name: Deploy documentation to GitHub Pages
    if: *publish_docs
    needs: [ci, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that this commit is still the default branch tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          if [[ "$tip" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy documentation
        id: deployment
        if: steps.tip.outputs.current == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

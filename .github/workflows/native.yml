name: C++ and CUDA checks

on:
  push:
    paths: &native_paths
      - '**/*.[cChH]'
      - '**/*.[cC][cCuU]'
      - '**/*.[cC][pP][pP]'
      - '**/*.[cC][xX][xX]'
      - '**/*.[hH][hH]'
      - '**/*.[hH][pP][pP]'
      - '**/*.[hH][xX][xX]'
      - '**/*.[cC][uU][hH]'
      - '.clang-tidy'
      - '.pre-commit-config.yaml'
      - '.github/workflows/native.yml'
      - 'pyproject.toml'
      - 'setup.py'
      - 'scripts/check_native.py'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
    paths: *native_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WHYDRA_BUILD_NATIVE: '0'
      WHYDRA_BUILD_CUDA: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: Install the CUDA 12.6 toolkit headers and PyTorch headers
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --output cuda-keyring.deb https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          echo 'd2a6b11c096396d868758b86dab1823b25e14d70333f1dfa74da5ddaf6a06dba  cuda-keyring.deb' | sha256sum --check
          sudo dpkg -i cuda-keyring.deb
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cuda-nvcc-12-6 libcurand-dev-12-6 libcublas-dev-12-6 libcusparse-dev-12-6 libcusolver-dev-12-6
          python -m pip install --no-cache-dir --no-deps --index-url https://download.pytorch.org/whl/cu126 'torch==2.7.1'
      - name: Analyze the native sources
        env:
          CUDA_HOME: /usr/local/cuda-12.6
        run: python scripts/check_native.py --all

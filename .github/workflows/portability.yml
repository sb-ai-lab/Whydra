name: Portable Python and native execution

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-package:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.backend }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ["3.10", "3.13", "3.14"]
        backend: [native, pure]
        include:
          - backend: native
            build-native: required
            disable-native: "0"
            expect-native: required
          - backend: pure
            build-native: "0"
            disable-native: "1"
            expect-native: disabled
    env:
      WHYDRA_BUILD_NATIVE: ${{ matrix.build-native }}
      WHYDRA_DISABLE_NATIVE: ${{ matrix.disable-native }}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            setup.py
      - name: Install package with the selected build mode
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip check
      - name: Exercise the installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -I "${{ github.workspace }}/scripts/check_portable_execution.py" --expect-native ${{ matrix.expect-native }} --installed

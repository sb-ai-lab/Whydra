minimum_pre_commit_version: "4.0.0"

repos:
  - repo: local
    hooks:
      - id: critical-lint
        name: Critical Python errors
        entry: python -m ruff check
        language: system
        types: [python]
        files: ^(\.github/(scripts|tests)/|whydra/|whydra_benchmarks/|tests/|main\.py$|docs/source/conf\.py$)

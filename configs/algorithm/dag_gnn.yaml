_target_: whydra.algorithms.wrappers.DagGNN

# Увеличиваем время обучения по сравнению с fast-версией
k_max_iter: 20      # Даем больше шагов для настройки штрафа за ацикличность
epochs: 100         # Даем больше эпох для сходимости на каждом шаге

lr: 5e-4            # Немного уменьшим learning rate для большей стабильности
batch_size: 128
graph_threshold: 0.1
encoder_hidden: 64
decoder_hidden: 64

# Отключаем L1-штраф (soft-thresholding).
# Пусть модель сначала выучит хоть какие-то веса, а потом мы их отсечем порогом.
tau_A: 0.0

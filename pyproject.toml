[build-system]
requires = ["setuptools>=75.3"]
build-backend = "setuptools.build_meta"

[project]
name = "whydra"
version = "0.1.0"
authors = [
  { name="Skoltech", email="S.Mokhnenko@skoltech.ru" },
]
description = "A library for causal graph building and uplift effect estimation in banking enterprise settings"
readme = "README.md"
requires-python = ">=3.10"

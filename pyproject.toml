# sber versions
#    "wheel==0.45.1",
#    "setuptools==75.3.4",
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "joblib>=1.4",
    "tqdm>=4.67",
    "tigramite>=5.2",
    "networkx>=3.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff==0.17.3",
    "pre-commit>=4,<5",
    "build>=1,<2",
]
comparison = [
    "causal-learn>=0.1.4",
]

[tool.setuptools.packages.find]
where = ["."]
include =[
    "whydra*",
    "whydra_benchmarks*"
]
exclude = ["playground*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
whydra_benchmarks = ["cases/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

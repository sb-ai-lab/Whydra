[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "whydra"
dynamic = ["version"]
description = "Fast causal discovery library: parallel PC-stable, FCI-stable (incl. CFCI, RFCI, GFCI, FCI+) and RAI algorithms."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Sber AI Lab" }]
keywords = ["causal discovery", "causal inference", "bayesian networks", "pc algorithm", "fci", "rfci", "gfci", "rai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "joblib>=1.3",
    "tqdm>=4.60",
    "networkx>=3.1",
]

[project.optional-dependencies]
bench = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "matplotlib>=3.7",
    "pydot>=1.4",
]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/sb-ai-lab/Whydra"
Source = "https://github.com/sb-ai-lab/Whydra"
Issues = "https://github.com/sb-ai-lab/Whydra/issues"

[tool.hatch.version]
path = "whydra/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["whydra"]

[tool.hatch.build.targets.sdist]
include = [
    "whydra",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
